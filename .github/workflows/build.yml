name: Build Windows and macOS Apps

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # กดสั่งรันเองจากหน้าเว็บ GitHub ได้

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact_name: macOS-App
          - os: windows-latest
            platform: windows/amd64
            artifact_name: Windows-App

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Application
        env:
          TMPDIR: /tmp
        run: wails build -clean -platform ${{ matrix.platform }}

      - name: Package macOS .app as ZIP (รักษา Permission ของไฟล์บน Mac)
        if: matrix.os == 'macos-latest'
        run: |
          cd build/bin
          ditto -c -k --sequesterRsrc --keepParent cross_platform_project.app cross_platform_project_mac.zip

      - name: Upload macOS Artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build/bin/cross_platform_project_mac.zip

      - name: Upload Windows Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build/bin/cross_platform_project.exe